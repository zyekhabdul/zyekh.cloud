name: CI / Build & Deploy

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'

      - name: Force install Node 20 on runner
        run: |
          echo "Forcing Node 20 installation via NodeSource"
          sudo apt-get update
          curl -fsSL https://deb.nodesource.com/setup_20.x | sudo -E bash -
          sudo apt-get install -y nodejs
          node -v
          npm -v

      - name: Build inside official Node 20 Docker
        env:
          VITE_GITHUB_TOKEN: ${{ secrets.VITE_GITHUB_TOKEN }}
        run: |
          echo "Building inside node:20 container"
          docker run --rm -v "$GITHUB_WORKSPACE":/work -w /work node:20-bullseye bash -lc '
            npm ci --prefer-offline --no-audit --no-fund && \
            npm run fetch:github && \
            npm run build --loglevel verbose
          '

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          publish_dir: ./dist
          publish_branch: gh-pages
          # Use the GITHUB_TOKEN provided by Actions to push
          github_token: ${{ secrets.GITHUB_TOKEN }}
