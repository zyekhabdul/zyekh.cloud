name: CI / Build & Deploy

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Debug environment
        run: |
          echo "== node/npm versions =="
          node -v
          npm -v
          echo "== env vars summary (no secrets printed) =="
          if [ -z "$VITE_GITHUB_TOKEN" ]; then echo "VITE_GITHUB_TOKEN: not set"; else echo "VITE_GITHUB_TOKEN: set"; fi
          echo "== workspace listing =="
          ls -la

      - name: Fetch GitHub data (build-time)
        env:
          VITE_GITHUB_TOKEN: ${{ secrets.VITE_GITHUB_TOKEN }}
        run: npm run fetch:github

      - name: Build
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          publish_dir: ./dist
          publish_branch: gh-pages
          # Use the GITHUB_TOKEN provided by Actions to push
          github_token: ${{ secrets.GITHUB_TOKEN }}
