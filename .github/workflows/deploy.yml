name: CI / Build & Deploy

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'

      - name: Force install Node 20 on runner
        run: |
          echo "Forcing Node 20 installation via NodeSource"
          sudo apt-get update
          curl -fsSL https://deb.nodesource.com/setup_20.x | sudo -E bash -
          sudo apt-get install -y nodejs
          node -v
          npm -v

      - name: Install Node20, fetch data and build (single step)
        env:
          VITE_GITHUB_TOKEN: ${{ secrets.VITE_GITHUB_TOKEN }}
        run: |
          echo "Forcing Node 20 installation via NodeSource"
          sudo apt-get update
          curl -fsSL https://deb.nodesource.com/setup_20.x | sudo -E bash -
          sudo apt-get install -y nodejs
          echo "== node/npm versions =="
          node -v
          npm -v
          echo "== installing dependencies =="
          npm ci --prefer-offline --no-audit --no-fund
          echo "== fetching GitHub data (build-time) =="
          npm run fetch:github
          echo "== running build =="
          npm run build --loglevel verbose

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          publish_dir: ./dist
          publish_branch: gh-pages
          # Use the GITHUB_TOKEN provided by Actions to push
          github_token: ${{ secrets.GITHUB_TOKEN }}
